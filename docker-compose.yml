

services:
  nms-dashboard:
    build: .
    container_name: nms-dashboard
    restart: always
    ports:
      # Expose ke 127.0.0.1 (localhost) agar aman dan ditangani oleh Nginx Host
      - "127.0.0.1:5000:5000"
    volumes:
      # Mount DIREKTORI (bukan file) agar network.db + -wal/-shm selalu satu kesatuan.
      # Mount file satu-per-satu menyebabkan Docker membuat DIREKTORI bernama
      # "network.db-wal" saat file belum ada di host -> database corrupt saat start.
      # Solusi: mount seluruh folder proyek (kode di host == kode di container).
      - ./:/app
      # Pastikan file network.db, .env sudah ada di host sebelum `docker compose up`
      # (sentuh manual: touch network.db .env), atau compose akan gagal fast-fail
      # alih-alih corrupt diam-diam.
