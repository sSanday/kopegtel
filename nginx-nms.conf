# WAJIB: tambahkan 2 baris ini ke blok http{} di /etc/nginx/nginx.conf
# (limit_req_zone TIDAK boleh di dalam server{}, nginx akan gagal reload):
#   limit_req_zone $binary_remote_addr zone=nms_login:10m rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=nms_api:10m rate=60r/m;

server {
    listen 80;
    server_name nms.domain-anda.com; # Ganti dengan domain atau IP Server Anda

    # Log file Nginx
    access_log /var/log/nginx/nms-access.log;
    error_log /var/log/nginx/nms-error.log;

    # Redirect permanen ke HTTPS setelah sertifikat terpasang (certbot).
    # Aktifkan blok ini dan blok :443 di bawah setelah `certbot --nginx` sukses:
    # return 301 https://$host$request_uri;

    # Security headers (berlaku HTTP maupun HTTPS)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Login dibatasi ketat (brute-force) + body kecil
    location = /login {
        limit_req zone=nms_login burst=5 nodelay;
        client_max_body_size 10k;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API dibatasi wajar; /api/agent/report dikecualikan dari limit umum
    # karena banyak agent melapor tiap 60 detik (atur burst sesuai jumlah agent)
    location = /api/agent/report {
        client_max_body_size 10k;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=nms_api burst=30 nodelay;
        client_max_body_size 100k;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:5000;

        # Header proxy standard
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (bila diperlukan ke depan)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

