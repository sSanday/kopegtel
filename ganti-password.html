<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ganti kata sandi · NMS Kopegtel</title>
  <meta name="description" content="Ganti kata sandi akun NMS Kopegtel." />
  <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060a14" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=2" />
  <link rel="stylesheet" href="assets/css/login.css?v=3" />
</head>
<body>
  <a class="skip-link" href="#ganti-form">Lewati ke formulir ganti kata sandi</a>

  <div class="auth">
    <main class="panel">
      <div class="panel__center">
        <section class="card" aria-labelledby="ganti-title">
          <p class="eyebrow eyebrow--card">Keamanan Akun</p>
          <h1 class="card__title" id="ganti-title">Ganti kata sandi</h1>
          <p class="card__sub" id="ganti-sub">Anda wajib mengganti kata sandi sebelum melanjutkan ke aplikasi.</p>

          <form class="form" id="ganti-form" novalidate>
            <div class="field">
              <label for="current-password">Kata sandi saat ini</label>
              <input id="current-password" name="current_password" type="password" autocomplete="current-password" required aria-describedby="current-error" />
              <p class="field__error" id="current-error" hidden></p>
            </div>

            <div class="field">
              <label for="new-password">Kata sandi baru (min. 10 karakter)</label>
              <input id="new-password" name="new_password" type="password" autocomplete="new-password" required aria-describedby="new-error" />
              <p class="field__error" id="new-error" hidden></p>
            </div>

            <div class="field">
              <label for="confirm-password">Ulangi kata sandi baru</label>
              <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required aria-describedby="confirm-error" />
              <p class="field__error" id="confirm-error" hidden></p>
            </div>

            <button class="btn" id="submit" type="submit">
              <span class="btn__spinner" aria-hidden="true"></span>
              <span class="btn__label">Simpan kata sandi</span>
            </button>

            <p class="form__note" id="form-note" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/js/api.js?v=1" defer></script>
  <script src="assets/js/ganti-password.js" defer></script>
</body>
</html>
