<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNMP Discovery</title><style>body{font-family:Arial;background:#08101c;color:#e6f1ff;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#101c2d;border:1px solid #263b55;border-radius:8px;padding:16px;margin-bottom:14px}input,button{background:#0a1422;color:#e6f1ff;border:1px solid #38516d;border-radius:5px;padding:9px}button{cursor:pointer;color:#65d9ff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #263b55}.muted{color:#8ca4bd}</style></head><body><main class="wrap"><p><a href="/">← Dashboard</a></p><h1>SNMP Auto-Discovery</h1><div class="card"><form id="form"><input id="network" placeholder="192.168.1.0/24" required><input id="community" placeholder="SNMP community" required maxlength="128"><button>Scan</button><button type="button" onclick="bulk()">Import terpilih</button></form><p class="muted">Maksimum 256 alamat. Community tidak disimpan.</p><button type="button" onclick="saveSchedule()">Simpan jadwal 6 jam</button><button type="button" onclick="runSchedule()">Jalankan scheduled scan</button></div><div class="card"><div id="status" class="muted">Belum ada scan.</div><table><thead><tr><th><input type="checkbox" onchange="toggleAll(this.checked)"></th><th>IP</th><th>Vendor</th><th>System name</th><th>Description</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('form').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='Scanning...';const r=await fetch('/api/discovery/snmp',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify({network:network.value,community:community.value})});const d=await r.json();if(!r.ok){status.textContent=d.error||'Discovery gagal';return}status.textContent=`${d.count} perangkat ditemukan`;rows.innerHTML=(d.devices||[]).map(x=>`<tr><td><input class="pick" type="checkbox" data-ip="${esc(x.ip)}" data-name="${esc(x.sys_name)}" data-vendor="${esc(x.vendor)}"></td><td>${esc(x.ip)}</td><td>${esc(x.vendor)}</td><td>${esc(x.sys_name)}</td><td>${esc(x.sys_descr)}</td></tr>`).join('')||'<tr><td colspan="5">Tidak ada perangkat.</td></tr>'};function toggleAll(v){document.querySelectorAll('.pick').forEach(x=>x.checked=v)}async function bulk(){const devices=[...document.querySelectorAll('.pick:checked')].map(x=>({ip:x.dataset.ip,sys_name:x.dataset.name,vendor:x.dataset.vendor}));if(!devices.length){alert('Pilih perangkat terlebih dahulu');return}const r=await fetch('/api/discovery/import',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify({devices,community:community.value})});const d=await r.json();alert(r.ok?`${d.count} host ditambahkan`:(d.error||'Import gagal'))}async function saveSchedule(){const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify({discovery_network:network.value,discovery_community:community.value})});const d=await r.json();alert(r.ok?'Jadwal disimpan':'Gagal: '+(d.error||''))}async function runSchedule(){const r=await fetch('/api/discovery/scheduled/run',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'}});const d=await r.json();alert(`Status: ${d.status}; baru ${d.added?.length||0}; hilang ${d.removed?.length||0}`)}</script></body></html>
