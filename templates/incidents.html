<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incident Dashboard</title>
<style>body{font-family:Arial,sans-serif;background:#08101c;color:#e6f1ff;margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.card{background:#101c2d;border:1px solid #263b55;border-radius:8px;padding:16px;margin-bottom:12px}.filters{display:flex;gap:8px;flex-wrap:wrap}select,input,button{background:#0a1422;color:#e6f1ff;border:1px solid #38516d;border-radius:5px;padding:8px}button{cursor:pointer;color:#65d9ff}.sev-disaster{border-left:4px solid #ff4264}.sev-high{border-left:4px solid #ff704d}.sev-warning{border-left:4px solid #ffc04d}.meta{color:#8ca4bd;font-size:.85rem}.alerts{margin-top:10px;padding-left:18px}.empty{text-align:center;color:#70e0a0;padding:40px}</style>
</head><body><main class="wrap"><div class="bar"><h1>Incident Dashboard</h1><a href="/">Dashboard</a></div><div class="card filters"><select id="severity"><option value="all">Semua severity</option><option value="disaster">Disaster</option><option value="high">High</option><option value="warning">Warning</option></select><input id="search" placeholder="Cari host incident"><button onclick="load()">Refresh</button></div><section id="list"><div class="empty">Memuat incident...</div></section></main>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/alerts/incidents',{headers:{'X-Requested-With':'XMLHttpRequest'}});if(r.status===401){location.href='/login';return}const d=await r.json();const sev=document.getElementById('severity').value,q=document.getElementById('search').value.toLowerCase();const rows=(d.incidents||[]).filter(i=>(sev==='all'||i.severity===sev)&&(!q||i.key.toLowerCase().includes(q)));document.getElementById('list').innerHTML=rows.length?rows.map(i=>`<article class="card sev-${esc(i.severity)}"><h2>${esc(i.key)} <small>${esc(i.severity).toUpperCase()}</small></h2><div class="meta">${i.count} alert · PIC ${esc(i.alerts.find(a=>a.assigned_to)?.assigned_to||'belum ditugaskan')}</div><ul class="alerts">${i.alerts.map(a=>`<li>${esc(a.message)} <span class="meta">(${esc(a.triggered_at)})</span></li>`).join('')}</ul></article>`).join(''):'<div class="empty">Tidak ada incident aktif.</div>'}document.getElementById('severity').onchange=load;document.getElementById('search').oninput=load;load();setInterval(load,30000);</script></body></html>
