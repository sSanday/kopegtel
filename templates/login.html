<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F6F4EE">
<title>Masuk · NMS Kopegtel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/tokens-v2.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login-v3.css') }}">
<script>
// Pradesain tema agar tidak berkedip. Kunci dan pola ini sama dengan
// template dasbor: "nms_theme", data-theme pada <html>, cadangan
// prefers-color-scheme, dan meta theme-color.
(function () {
  try {
    var t = localStorage.getItem("nms_theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "dark" ? "#1B1A18" : "#F6F4EE");
  } catch (_) {}
})();
</script>
</head>
<body>
<a class="skip-link" href="#loginForm">Lompat ke formulir masuk</a>

<svg width="0" height="0" class="simbol" aria-hidden="true" focusable="false">
  <symbol id="simbol-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4" width="19" height="13" rx="1.5"></rect>
    <path d="M9 21h6M12 17v4"></path>
  </symbol>
</svg>

<div class="login">
  <div class="login-form">
    <div class="login-form-dalam">
      <p class="merek merek--mobile">
        <svg width="26" height="26" aria-hidden="true"><use href="#simbol-monitor"></use></svg>
        <b>NMS Kopegtel</b>
      </p>

      <h1>Masuk</h1>
      <p class="sub">Gunakan akun yang diberikan administrator.</p>

      <div class="pesan-error" id="pesanError" role="alert" {% if not error %}hidden{% endif %}>
        {{ error }}
      </div>

      <form id="loginForm" method="POST" novalidate>
        <div class="baris">
          <label for="username">Nama pengguna</label>
          <div class="isi">
            <input type="text" id="username" name="username" autocomplete="username"
                   autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus
                   value="{{ request.form.get('username', '') }}">
          </div>
        </div>

        <div class="baris">
          <label for="password">Kata sandi</label>
          <div class="isi isi--sandi">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="lihat-sandi" id="lihatSandi"
                    aria-label="Tampilkan kata sandi" aria-pressed="false"></button>
          </div>
          <p class="caps" id="capsNote">Caps Lock aktif.</p>
        </div>

        <div class="ingat">
          <input type="checkbox" id="remember" name="remember" value="1" checked>
          <label for="remember">Tetap masuk selama 7 hari</label>
        </div>

        <button type="submit" class="tombol-masuk" id="tombolMasuk">
          <span id="tombolLabel">Masuk</span>
        </button>

        <p class="bantuan">Lupa kata sandi? Hubungi administrator.</p>
      </form>
    </div>
  </div>

  <div class="login-sisi">
    <p class="merek">
      <svg width="28" height="28" aria-hidden="true"><use href="#simbol-monitor"></use></svg>
      <b>NMS Kopegtel</b>
    </p>

    <figure class="topo">
      <svg viewBox="0 0 520 230" role="img"
           aria-label="Diagram: Server NMS memeriksa host lewat router dan switch.">
        <g class="topo-jalur">
          <path d="M392 98V172H442"></path>
        </g>
        <g class="topo-jalur topo-jalur--aksen">
          <path d="M136 72H188"></path>
          <path d="M264 72H316"></path>
          <path d="M392 72H442"></path>
        </g>

        <g class="topo-simbol">
          <rect x="40" y="38" width="96" height="68"></rect>
          <rect x="56" y="50" width="64" height="15"></rect>
          <rect x="56" y="69" width="64" height="15"></rect>
          <rect x="56" y="88" width="36" height="8"></rect>

          <rect x="188" y="46" width="76" height="52"></rect>
          <path d="M226 54V90M202 72H250"></path>
          <path d="M222 61l4-6 4 6M222 83l4 6 4-6M217 68l-6 4 6 4M235 68l6 4-6 4"></path>

          <rect x="316" y="46" width="76" height="52"></rect>
          <path d="M328 64H378M372 58l6 6-6 6"></path>
          <path d="M378 80H328M334 74l-6 6 6 6"></path>

          <rect x="442" y="50" width="64" height="44"></rect>
          <rect x="450" y="56" width="48" height="27"></rect>
          <path d="M474 83v9M462 92h24"></path>

          <rect x="442" y="150" width="64" height="44"></rect>
          <rect x="450" y="156" width="48" height="27"></rect>
          <path d="M474 183v9M462 192h24"></path>
        </g>

        <g class="topo-label">
          <text x="88" y="124" text-anchor="middle">Server NMS</text>
          <text x="226" y="124" text-anchor="middle">Router</text>
          <text x="354" y="124" text-anchor="middle">Switch</text>
          <text x="474" y="124" text-anchor="middle">Host</text>
          <text x="474" y="216" text-anchor="middle">Host</text>
        </g>
      </svg>
      <figcaption>Server NMS memeriksa host lewat ping ICMP dan SNMP.</figcaption>
    </figure>

    <footer class="login-kaki">
      <p>Akses hanya untuk pengguna yang berwenang.</p>
      <div class="tema" role="group" aria-label="Pilihan tema">
        <span class="tema-label">Tema:</span>
        <button type="button" class="tema-pilih" data-mode="auto" aria-pressed="true">Otomatis</button>
        <button type="button" class="tema-pilih" data-mode="light" aria-pressed="false">Terang</button>
        <button type="button" class="tema-pilih" data-mode="dark" aria-pressed="false">Gelap</button>
      </div>
    </footer>
  </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</body>
</html>
