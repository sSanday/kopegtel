<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="NMS Kopegtel — Maps: daftar peta topologi jaringan (nama, ukuran, panel properti)">
<title>Maps · NMS Kopegtel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<script>
// Terapkan tema tersimpan sebelum render untuk menghindari kedip.
(function () {
  try {
    var t = localStorage.getItem("nms_theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "dark" ? "#0b0f14" : "#eef1f6");
  } catch (_) {}
})();
</script>
<style>
/* ============ Halaman Maps (struktur Zabbix, tema aplikasi) ============ */
.zbx { padding: 18px 22px 40px; max-width: 1400px; }

.zbx-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.zbx-head h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
.zbx-head .spacer { flex: 1; }
.zbx-help { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; color: var(--text-2); text-decoration: none; font-weight: 700; border: 1px solid var(--border); }
.zbx-help:hover { color: var(--text); background: var(--surface-2); }
.zbx-btn {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  border-radius: 8px; font-weight: 600; font-size: 13px; padding: 8px 16px; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
}
.zbx-btn:hover { background: var(--accent-soft); }
.zbx-btn.primary { background: var(--accent-btn); color: var(--on-primary); border-color: transparent; }
.zbx-btn.primary:hover { filter: brightness(1.08); }
.zbx-btn[disabled] { opacity: .5; cursor: not-allowed; }
.zbx-btn[disabled]:hover { background: var(--surface-2); }

/* ---- Bar filter: tombol corong + label, mengambang kanan ---- */
.zbx-bar { display: flex; justify-content: flex-end; position: relative; z-index: 2; }
.zbx-ftoggle {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.zbx-ftoggle .chev { width: 12px; height: 12px; transition: transform .15s; color: var(--text-3); }
.zbx-ftoggle.open .chev { transform: rotate(180deg); }
.zbx-ftoggle:hover { background: var(--surface-2); }

/* ---- Panel filter ---- */
.zbx-filter {
  margin-top: 6px; padding: 22px 18px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
}
.zbx-filter.hidden { display: none; }
.zbx-frow { display: flex; align-items: center; justify-content: center; gap: 10px; }
.zbx-frow > label.f { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.zbx-input {
  width: min(420px, 86%); box-sizing: border-box;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 11px; font-size: 13px; font-family: inherit;
}
.zbx-input::placeholder { color: var(--text-3); }
.zbx-input:focus { outline: none; border-color: var(--accent); }
.zbx-factions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }

/* ---- Tabel hasil ---- */
.zbx-table-wrap {
  margin-top: 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
}
.zbx-scroll { overflow-x: auto; }
table.zbx { width: 100%; border-collapse: collapse; font-size: 13px; }
table.zbx thead th {
  text-align: left; font-weight: 600; color: var(--text-2);
  padding: 10px 10px; white-space: nowrap; border-bottom: 1px solid var(--border);
  background: var(--surface); font-size: 12.5px;
}
table.zbx thead th .th-sort {
  background: none; border: none; color: inherit; font: inherit; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; padding: 0; font-family: inherit;
}
table.zbx thead th .th-sort:hover { color: var(--text); }
.chev-mini { width: 11px; height: 11px; transition: transform .15s; }
.chev-mini.asc { transform: rotate(180deg); }
table.zbx tbody td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-2); }
table.zbx tbody tr:hover td { background: var(--surface-2); }
table.zbx tbody tr:last-child td { border-bottom: none; }
td.chk { width: 34px; }
td.chk input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.map-link { color: var(--accent); text-decoration: none; font-weight: 600; }
.map-link:hover { text-decoration: underline; }
td.dimc { font-variant-numeric: tabular-nums; white-space: nowrap; }
.act { color: var(--accent); text-decoration: none; font-size: 12.5px; font-weight: 600; margin-right: 10px; }
.act:hover { text-decoration: underline; }
.zbx-empty { padding: 42px 12px; text-align: center; color: var(--text-3); font-size: 13px; }
.zbx-empty .big { font-size: 14.5px; color: var(--text-2); font-weight: 600; margin-bottom: 4px; }
.found-note { text-align: right; padding: 8px 10px 2px; color: var(--text-3); font-size: 12px; }
.zbx-bulk {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px 12px;
  color: var(--text-3); font-size: 12.5px;
}
.zbx-bulk .lbl { min-width: 64px; }

/* ---- Modal ---- */
.modal-back {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 400;
  display: none; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px;
}
.modal-back.on { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  width: min(430px, 100%); box-shadow: 0 18px 48px rgba(0,0,0,.35);
}
.modal-head { display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border); }
.modal-head h3 { margin: 0; font-size: 15px; }
.modal-x { background: none; border: none; color: var(--text-3); font-size: 18px; cursor: pointer; line-height: 1; }
.modal-x:hover { color: var(--text); }
.modal-body { padding: 16px 18px; display: grid; gap: 12px; }
.frow { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 10px; }
.frow > label.f { font-size: 12.5px; color: var(--text-2); font-weight: 500; text-align: right; }
.finput {
  width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit;
}
.finput:focus { outline: none; border-color: var(--accent); }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); }
.modal-err { color: #e5484d; font-size: 12.5px; min-height: 16px; }

/* toast */
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 500; }
.toast {
  display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: 10px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: opacity .25s;
}
.toast svg { width: 16px; height: 16px; }
.toast.success svg { color: #3fb27f; }
.toast.error svg { color: #e5484d; }

@media (max-width: 720px) {
  .zbx { padding: 14px 12px 30px; }
}
</style>
</head>

<script>
/* ================= Shell: tema, sidebar, menu ================= */
(function () {
  function $(id) { return document.getElementById(id); }
  var ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5z"/></svg>';
  var ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="width:19px;height:19px"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('nms_theme', t); } catch (_) {}
    var b = $('themeBtn');
    if (b) { b.innerHTML = t === 'dark' ? ICON_SUN : ICON_MOON; b.title = t === 'dark' ? 'Ganti ke mode terang' : 'Ganti ke mode gelap'; }
  }
  try {
    var t = localStorage.getItem('nms_theme');
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    setTheme(t);
  } catch (_) {}
  var tb = $('themeBtn'); if (tb) tb.addEventListener('click', function () { setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); });
  try { if (localStorage.getItem('nms_nav') === 'collapsed' && window.innerWidth > 1100) document.body.classList.add('nav-collapsed'); } catch (_) {}
  var st = $('sidebarToggle'); if (st) st.addEventListener('click', function () { document.body.classList.toggle('nav-open'); });
  var sc = $('scrim'); if (sc) sc.addEventListener('click', function () { document.body.classList.remove('nav-open'); });
  var cb = $('collapseBtn'); if (cb) cb.addEventListener('click', function () {
    document.body.classList.toggle('nav-collapsed');
    try { localStorage.setItem('nms_nav', document.body.classList.contains('nav-collapsed') ? 'collapsed' : 'open'); } catch (_) {}
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.body.classList.remove('nav-open'); });
  var ub = $('userBtn'), um = $('userMenu');
  if (ub && um) {
    ub.addEventListener('click', function (e) { e.stopPropagation(); var open = um.style.display === 'none'; um.style.display = open ? 'block' : 'none'; ub.setAttribute('aria-expanded', open ? 'true' : 'false'); });
    document.addEventListener('click', function () { um.style.display = 'none'; ub.setAttribute('aria-expanded', 'false'); });
    um.addEventListener('click', function (e) { e.stopPropagation(); });
  }
  window.toast = function (msg, type) {
    var w = $('toasts'); if (!w) return;
    var el = document.createElement('div');
    el.className = 'toast ' + (type === 'error' ? 'error' : 'success');
    el.setAttribute('role', 'status');
    el.innerHTML = (type === 'error'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 17H2L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>') + '<span></span>';
    el.lastChild.textContent = msg;
    w.appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 250); }, 3500);
  };
})();

/* ================= Maps: daftar, filter, aksi ================= */
(function () {
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var state = { name: '', sort: 'name_asc' };
  var maps = [];
  var selected = {};      /* id peta → true */

  try {
    var saved = JSON.parse(localStorage.getItem('nms_maps_filter') || 'null');
    if (saved && typeof saved.name === 'string') state.name = saved.name;
    if (saved && saved.sort === 'name_desc') state.sort = 'name_desc';
  } catch (_) {}
  if (state.name) $('fName').value = state.name;
  syncChev();

  function syncChev() {
    var c = $('chevName');
    c.classList.toggle('asc', state.sort === 'name_asc');
    $('sortName').setAttribute('aria-label', 'Urutkan berdasarkan nama peta (kini ' + (state.sort === 'name_asc' ? 'A-Z' : 'Z-A') + ')');
  }

  $('filterToggle').addEventListener('click', function () {
    var p = $('filterPanel');
    var hide = p.classList.toggle('hidden');
    this.classList.toggle('open', !hide);
    this.setAttribute('aria-expanded', hide ? 'false' : 'true');
  });
  $('fName').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnApply').click(); });
  $('btnApply').addEventListener('click', function () {
    state.name = $('fName').value.trim();
    try { localStorage.setItem('nms_maps_filter', JSON.stringify(state)); } catch (_) {}
    load();
  });
  $('btnReset').addEventListener('click', function () {
    state = { name: '', sort: 'name_asc' };
    $('fName').value = '';
    try { localStorage.setItem('nms_maps_filter', JSON.stringify(state)); } catch (_) {}
    syncChev();
    load();
  });
  $('sortName').addEventListener('click', function () {
    state.sort = state.sort === 'name_asc' ? 'name_desc' : 'name_asc';
    try { localStorage.setItem('nms_maps_filter', JSON.stringify(state)); } catch (_) {}
    syncChev();
    load();
  });

  function render() {
    var tb = $('tbody');
    if (!maps.length) {
      tb.innerHTML = '<tr><td colspan="5" class="zbx-empty"><div class="big">' +
        (state.name ? 'Tidak ada peta sesuai filter.' : 'Belum ada peta.') +
        '</div><div>Klik <strong>Buat peta</strong> untuk memulai, atau Atur ulang filter.</div></td></tr>';
    } else {
      var html = '';
      for (var i = 0; i < maps.length; i++) {
        var m = maps[i];
        html += '<tr data-id="' + m.id + '">' +
          '<td class="chk"><input type="checkbox" data-id="' + m.id + '"' + (selected[m.id] ? ' checked' : '') + ' aria-label="Pilih peta ' + esc(m.name) + '"></td>' +
          '<td><a class="map-link" href="/maps/' + m.id + '/edit">' + esc(m.name) + '</a></td>' +
          '<td class="dimc">' + m.width + '</td>' +
          '<td class="dimc">' + m.height + '</td>' +
          '<td><a class="act" href="#" data-prop="' + m.id + '" data-name="' + esc(m.name) + '" data-w="' + m.width + '" data-h="' + m.height + '">Properti</a>' +
          '<a class="act" href="/maps/' + m.id + '/edit">Edit</a></td>' +
          '</tr>';
      }
      tb.innerHTML = html;
    }
    $('foundNote').textContent = 'Ditampilkan ' + maps.length + ' dari ' + maps.length + ' yang ditemukan';
    syncBulk();
  }
  function syncBulk() {
    var n = Object.keys(selected).length;
    $('selLabel').textContent = n + ' dipilih';
    $('btnExport').disabled = n === 0;
    $('btnDelete').disabled = n === 0;
    var boxes = document.querySelectorAll('#tbody input[type="checkbox"]');
    $('chkAll').checked = boxes.length > 0 && n === boxes.length;
  }
  function load() {
    var q = new URLSearchParams();
    q.set('sort', state.sort);
    if (state.name) q.set('name', state.name);
    return fetch('/api/maps?' + q.toString(), { credentials: 'same-origin', headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        maps = data.maps || [];
        var ids = {}; maps.forEach(function (m) { ids[m.id] = true; });
        Object.keys(selected).forEach(function (k) { if (!ids[k]) delete selected[k]; });
        render();
      })
      .catch(function (err) { toast('Gagal memuat peta: ' + err.message, 'error'); });
  }

  $('tbody').addEventListener('change', function (e) {
    var box = e.target.closest('input[type="checkbox"]');
    if (!box) return;
    var id = Number(box.getAttribute('data-id'));
    if (box.checked) selected[id] = true; else delete selected[id];
    syncBulk();
  });
  $('chkAll').addEventListener('change', function () {
    selected = {};
    if (this.checked) maps.forEach(function (m) { selected[m.id] = true; });
    document.querySelectorAll('#tbody input[type="checkbox"]').forEach(function (b) {
      b.checked = !!selected[Number(b.getAttribute('data-id'))];
    });
    syncBulk();
  });
  $('tbody').addEventListener('click', function (e) {
    var a = e.target.closest('a[data-prop]');
    if (!a) return;
    e.preventDefault();
    openModal('prop', {
      id: Number(a.getAttribute('data-prop')),
      name: a.getAttribute('data-name'),
      width: a.getAttribute('data-w'),
      height: a.getAttribute('data-h')
    });
  });

  /* ---- Modal buat/properti ---- */
  var modalMode = null, modalId = null;
  function openModal(mode, data) {
    modalMode = mode; modalId = data && data.id || null;
    $('modalTitle').textContent = mode === 'create' ? 'Buat peta' : 'Properti peta';
    $('mName').value = data ? data.name : '';
    $('mWidth').value = data ? data.width : 960;
    $('mHeight').value = data ? data.height : 540;
    $('modalErr').textContent = '';
    $('modalBack').classList.add('on');
    $('mName').focus();
  }
  function closeModal() { $('modalBack').classList.remove('on'); }
  $('btnCreate').addEventListener('click', function () { openModal('create'); });
  $('modalClose').addEventListener('click', closeModal);
  $('modalCancel').addEventListener('click', closeModal);
  $('modalBack').addEventListener('click', function (e) { if (e.target === $('modalBack')) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  $('modalOk').addEventListener('click', function () {
    var name = $('mName').value.trim();
    var width = Number($('mWidth').value);
    var height = Number($('mHeight').value);
    if (!name) { $('modalErr').textContent = 'Nama wajib diisi.'; return; }
    if (!(width >= 100 && width <= 65535) || !(height >= 100 && height <= 65535)) {
      $('modalErr').textContent = 'Dimensi harus 100 sampai 65535 piksel.'; return;
    }
    var p = modalMode === 'create'
      ? fetch('/api/maps', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, width: width, height: height }) })
      : fetch('/api/maps/' + modalId, { method: 'PATCH', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, width: width, height: height }) });
    p.then(function (r) { return r.json().then(function (j) { return { ok: r.status < 300, data: j }; }); })
      .then(function (res) {
        if (!res.ok) { $('modalErr').textContent = res.data.error || 'Gagal menyimpan.'; return; }
        closeModal();
        if (modalMode === 'create') { window.location.href = '/maps/' + res.data.id + '/edit'; return; }
        toast('Properti peta tersimpan');
        load();
      })
      .catch(function (e) { $('modalErr').textContent = 'Gagal: ' + e.message; });
  });

  /* ---- Ekspor JSON peta terpilih ---- */
  $('btnExport').addEventListener('click', function () {
    var ids = Object.keys(selected).map(Number);
    if (!ids.length) return;
    fetch('/api/maps/export', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: ids })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.blob();
    }).then(function (b) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'maps_export.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast('Ekspor ' + ids.length + ' peta diunduh');
    }).catch(function (e) { toast('Ekspor gagal: ' + e.message, 'error'); });
  });

  /* ---- Impor JSON hasil ekspor ---- */
  $('btnImport').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    f.text().then(function (txt) {
      var j = JSON.parse(txt);
      if (!j || !Array.isArray(j.maps)) throw new Error('format tidak dikenal (harus hasil ekspor Maps)');
      return fetch('/api/maps/import', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(j)
      }).then(function (r) { return r.json().then(function (body) { return { ok: r.status < 300, body: body }; }); })
        .then(function (res) {
          if (res.body.count) toast('Impor ' + res.body.count + ' peta berhasil');
          if (res.body.errors && res.body.errors.length) toast(res.body.errors.join('; '), 'error');
          load();
        });
    }).catch(function (e) { toast('Impor gagal: ' + e.message, 'error'); });
  });

  /* ---- Hapus terpilih ---- */
  $('btnDelete').addEventListener('click', function () {
    var ids = Object.keys(selected).map(Number);
    if (!ids.length) return;
    if (!confirm('Hapus ' + ids.length + ' peta terpilih beserta elemennya?')) return;
    fetch('/api/maps', {
      method: 'DELETE', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: ids })
    }).then(function (r) { return r.json().then(function (b) { return { ok: r.status < 300, b: b }; }); })
      .then(function (res) {
        if (!res.ok) { toast(res.b.error || 'Gagal menghapus', 'error'); return; }
        selected = {};
        toast(res.b.deleted + ' peta dihapus');
        load();
      })
      .catch(function (e) { toast('Gagal menghapus: ' + e.message, 'error'); });
  });

  // Zabbix langsung menampilkan daftar; filter tersimpan ikut dimuat.
  load();
})();
</script>
</body>
</html>
