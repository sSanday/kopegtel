<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topologi Fiber — NMS KOPEGTEL</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c14;--surface:#0c1220;--card:rgba(12,18,32,.8);--border:rgba(0,255,136,.1);--border2:rgba(255,255,255,.06);--accent:#00a2ff;--accent2:#00ff88;--t1:#e0f0ff;--t2:#6a8aaa;--t3:#2a4060;--mono:'JetBrains Mono',monospace;--danger:#ff4444;--success:#00ff88;--warn:#ffaa00}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;height:52px;background:rgba(8,12,20,.97);border-bottom:1px solid var(--border2);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.tb-brand{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:.72rem}
.tb-logo{width:26px;height:26px;background:linear-gradient(135deg,#00a2ff,#00ff88);border-radius:5px;display:flex;align-items:center;justify-content:center}
.tb-path{display:flex;align-items:center;gap:8px;color:var(--t2)}
.tb-path a.crumb{color:var(--t2);text-decoration:none;transition:.15s;border-radius:4px;padding:2px 4px;margin:-2px -4px}
.tb-path a.crumb:hover{color:var(--t1);background:rgba(255,255,255,.05)}
.tb-path .crumb.active{color:var(--accent2);background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.22);border-radius:99px;padding:2px 10px}
.tb-sep{color:var(--t3);font-size:.62rem}
.tb-links{display:flex;gap:4px;background:rgba(0,0,0,.2);border:1px solid var(--border2);border-radius:6px;padding:3px}
.tb-links .back-btn{border-color:transparent;border-radius:4px}
.tb-links{display:flex;gap:8px}
.back-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border2);color:var(--t2);padding:6px 12px;border-radius:5px;font-family:var(--mono);font-size:.65rem;text-decoration:none}
.back-btn:hover{color:var(--t1)}
.wrap{padding:20px 24px 48px;max-width:1600px;margin:0 auto}
.sec-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--t3);margin-bottom:12px}
.sec-label::before{content:'//';color:var(--accent2)}
.layout{display:grid;grid-template-columns:minmax(340px,420px) 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.panel-hd{padding:12px 16px;border-bottom:1px solid var(--border2);font-family:var(--mono);font-size:.7rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.head-count{font-family:var(--mono);font-size:.6rem;color:var(--t3);background:rgba(0,0,0,.25);border:1px solid var(--border2);border-radius:99px;padding:2px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.add-btn{background:rgba(0,162,255,.1);border:1px solid rgba(0,162,255,.3);color:var(--accent);padding:8px 16px;border-radius:5px;font-family:var(--mono);font-size:.7rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.add-btn:hover{background:rgba(0,162,255,.2);color:#fff}
.empty-panel{text-align:center;padding:32px 20px;border:1px dashed rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.015);margin:12px}
.empty-ic{color:var(--t3);margin-bottom:10px;display:flex;justify-content:center}
.empty-t{font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--t1);margin-bottom:5px}
.empty-d{font-family:var(--mono);font-size:.62rem;color:var(--t3);margin:0 auto 14px;line-height:1.7;max-width:420px}
#map{height:560px;min-height:320px;background:#0a0f1a;z-index:1}
.tree{max-height:560px;overflow-y:auto;padding:8px}
details{border:1px solid var(--border2);border-radius:6px;margin-bottom:6px;background:rgba(0,0,0,.2)}
details details{margin:6px 8px}
summary{cursor:pointer;padding:9px 12px;font-family:var(--mono);font-size:.7rem;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';color:var(--accent2);font-size:.65rem}
details[open]>summary::before{content:'▾'}
summary:hover{background:rgba(255,255,255,.02)}
.ont-row{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 26px;font-family:var(--mono);font-size:.68rem;color:var(--t2);border-top:1px solid rgba(255,255,255,.03)}
.ont-row:hover{background:rgba(255,255,255,.02)}
.ont-row .rx{margin-left:auto;font-weight:700;color:var(--t1);white-space:nowrap}
.tag{font-family:var(--mono);font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;border-radius:3px;padding:3px 8px;white-space:nowrap;display:inline-block}
.tag.normal{background:rgba(0,255,136,.1);color:var(--success);border:1px solid rgba(0,255,136,.25)}
.tag.warning{background:rgba(255,170,0,.1);color:var(--warn);border:1px solid rgba(255,170,0,.3)}
.tag.critical{background:rgba(255,68,68,.12);color:var(--danger);border:1px solid rgba(255,68,68,.35)}
.tag.overload{background:rgba(255,0,200,.12);color:#ff66dd;border:1px solid rgba(255,0,200,.35)}
.tag.stale{background:rgba(183,156,255,.1);color:#b79cff;border:1px dashed rgba(183,156,255,.45)}
.tag.unknown{background:transparent;color:var(--t3);border:1px solid var(--border2)}
.counts{font-size:.6rem;color:var(--t3);margin-left:auto;white-space:nowrap}
.nocoord{margin:0 16px 12px;font-family:var(--mono);font-size:.62rem;color:var(--t2);line-height:1.7;background:rgba(255,170,0,.05);border:1px solid rgba(255,170,0,.18);border-radius:8px;padding:10px 14px}
.nocoord b{color:var(--warn)}
.clickread{padding:10px 16px;font-family:var(--mono);font-size:.62rem;color:var(--t2);border-top:1px solid var(--border2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clickread .coord{font-size:.65rem;color:var(--t1);background:rgba(0,0,0,.3);border:1px solid var(--border2);border-radius:6px;padding:4px 10px;font-variant-numeric:tabular-nums;min-width:170px;text-align:center}
.clickread .copy-btn{background:rgba(0,162,255,.1);border:1px solid rgba(0,162,255,.3);color:var(--accent);padding:4px 12px;border-radius:5px;font-family:var(--mono);font-size:.62rem;cursor:pointer}
.clickread .copy-btn:hover{background:rgba(0,162,255,.2);color:#fff}
.legend{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;font-family:var(--mono);font-size:.6rem;color:var(--t2);border-top:1px solid var(--border2)}
.legend span{display:inline-flex;align-items:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:99px;padding:3px 10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:4px}
.leaflet-popup-content-wrapper{background:#0c1220;color:#e0f0ff;border:1px solid rgba(255,255,255,.08)}
.leaflet-popup-content{font-family:var(--mono);font-size:.68rem;line-height:1.7}
.leaflet-popup-tip{background:#0c1220}
.leaflet-popup-content a{color:#00a2ff}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-brand"><div class="tb-logo">◈</div>
    <div class="tb-path"><a class="crumb" href="/" title="Dashboard utama">~/noc</a><span class="tb-sep">›</span><a class="crumb" href="/" title="Dashboard utama">dashboard</a><span class="tb-sep">›</span><span class="crumb active">topo</span></div>
  </div>
  <div class="tb-links"><a href="/fiber" class="back-btn">fiber</a><a href="/" class="back-btn">← cd ..</a></div>
</div>
<div class="wrap">
  <div class="sec-label">fiber_topology.tree — OLT → ODP → ONT</div>
  <div class="layout">
    <div class="panel"><div class="panel-hd"><span>fiber_tree.topo</span><span id="treeCount" class="head-count">loading...</span></div><div class="tree" id="tree"></div></div>
    <div class="panel">
      <div class="panel-hd"><span>fiber_map.geo</span><span id="mapCount" class="head-count"></span></div>
      <div id="map"></div>
      <div class="clickread"><span>klik peta untuk salin koordinat lat/lon ODP & OLT:</span><b id="clickPos" class="coord">—</b><button class="copy-btn" id="copyBtn" onclick="copyPos()">copy</button></div>
      <div class="legend"><span><i style="background:#00a2ff"></i>OLT</span><span><i style="background:#00ff88"></i>normal</span><span><i style="background:#ffaa00"></i>warning</span><span><i style="background:#ff4444"></i>critical</span><span><i style="background:#ff66dd"></i>overload</span><span><i style="background:#b79cff"></i>stale</span></div>
      <div class="nocoord" id="noCoord" style="display:none"></div>
    </div>
  </div>
</div>
<script>
let TOPO=null, map=null, lastClick=null, lastTopoJson='', firstFit=true;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS={normal:'#00ff88',warning:'#ffaa00',critical:'#ff4444',overload:'#ff66dd',stale:'#b79cff',unknown:'#2a4060'};
function countsTxt(c){return `Σ${c.total} 🟢${c.normal} 🟡${c.warning} 🔴${c.critical} 🔊${c.overload} 🟣${c.stale}`;}
async function load(){
  const r=await fetch('/api/fiber/topology',{headers:{'X-Requested-With':'XMLHttpRequest'}});
  if(r.status===401){location.href='/login';return;}
  const txt=await r.text();
  if(txt===lastTopoJson)return; // tak ada perubahan -> jangan reset tree/zoom user
  lastTopoJson=txt;
  TOPO=JSON.parse(txt);
  renderTree(); renderMap();
}
function renderTree(){
  const olts=(TOPO&&TOPO.olts)||[];
  let nOnt=0;olts.forEach(o=>{nOnt+=o.counts.total;});
  document.getElementById('treeCount').textContent=`${olts.length} OLT · ${nOnt} ONT`;
  const box=document.getElementById('tree');
  if(!olts.length){box.innerHTML='<div class="empty-panel"><div class="empty-ic"><svg width="26" height="26" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="8" cy="3" r="1.6"/><circle cx="3.5" cy="12.5" r="1.6"/><circle cx="12.5" cy="12.5" r="1.6"/><path d="M8 4.6v3M8 7.6L4.3 11M8 7.6l3.7 3.4"/></svg></div><div class="empty-t">belum ada topologi</div><div class="empty-d">Tambah OLT / ODP / ONT di halaman fiber — pohon & peta terisi otomatis.</div><a class="add-btn" href="/fiber">buka fiber →</a></div>';return;}
  box.innerHTML=olts.map(o=>`<details${o.worst!=='normal'?' open':''}>
    <summary><span class="tag ${esc(o.worst)}">${esc(o.worst)}</span><b style="color:var(--t1)">${esc(o.name)}</b>${o.registered?'':' <span style="color:var(--warn)">(liar)</span>'}<span class="counts">${esc(countsTxt(o.counts))}</span></summary>
    ${(o.odps||[]).map(d=>`<details${d.worst!=='normal'?' open':''}>
      <summary><span class="tag ${esc(d.worst)}">${esc(d.worst)}</span><span>${esc(d.name)}</span><span class="counts">${d.odp.capacity?esc(d.counts.total)+'/'+esc(d.odp.capacity)+' port · ':''}${esc(countsTxt(d.counts))}</span></summary>
      ${(d.onts||[]).map(t=>`<div class="ont-row" title="${esc(t.customer||'')}${t.pon_port?' · PON '+esc(t.pon_port):''}"><span class="tag ${esc(t.status)}">${esc(t.status)}</span><span style="color:var(--t1)">${esc(t.ont_sn)}</span><span>${esc(t.customer||'')}</span><span class="rx">${t.rx_power==null?'—':esc(t.rx_power)+' dBm'}</span></div>`).join('')||'<div class="ont-row">$ kosong</div>'}
    </details>`).join('')}
  </details>`).join('');
}
function renderMap(){
  if(!map){
    map=L.map('map').setView([-2.5,118],5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    map.on('click',e=>{lastClick=e.latlng;document.getElementById('clickPos').textContent=`${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;});
  }
  const olts=(TOPO&&TOPO.olts)||[];
  let marks=0;const missing=[];
  const bounds=[];
  if(map._topoLayer)map.removeLayer(map._topoLayer);
  const lg=L.layerGroup().addTo(map);map._topoLayer=lg;
  olts.forEach(o=>{
    (o.odps||[]).forEach(d=>{
      const od=d.odp||{};
      const onts=d.onts||[];
      const worstOnts=onts.filter(t=>t.status==='critical'||t.status==='overload').slice(0,5);
      const li=worstOnts.map(t=>`<li>${esc(t.ont_sn)} — ${t.rx_power==null?'—':esc(t.rx_power)+' dBm'} (${esc(t.status)})</li>`).join('');
      if(od.lat!=null&&od.lon!=null){
        marks++;
        bounds.push([od.lat,od.lon]);
        L.circleMarker([od.lat,od.lon],{radius:8,color:COLORS[d.worst]||'#2a4060',weight:2,fillColor:COLORS[d.worst]||'#2a4060',fillOpacity:.35})
          .addTo(lg)
          .bindPopup(`<b>${esc(d.name)}</b><br>${esc(o.name)}${od.location?' · '+esc(od.location):''}<br>${esc(countsTxt(d.counts))}${od.capacity?`<br>kapasitas ${esc(d.counts.total)}/${esc(od.capacity)}`:''}${li?`<br>terburuk:<ul style="margin:4px 0 4px 16px">${li}</ul>`:''}<br><a href="/fiber">buka fiber →</a>`);
      } else if(od.id){missing.push(d.name);}
    });
    if(o.olt&&o.olt.lat!=null&&o.olt.lon!=null){
      marks++;
      bounds.push([o.olt.lat,o.olt.lon]);
      L.marker([o.olt.lat,o.olt.lon],{icon:L.divIcon({className:'',html:`<div style="width:22px;height:22px;background:linear-gradient(135deg,#00a2ff,#00ff88);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#000">▲</div>`,iconSize:[22,22],iconAnchor:[11,11]})})
        .addTo(lg)
        .bindPopup(`<b>OLT ${esc(o.name)}</b> (${esc(o.olt.vendor||'generic')})<br>${esc(o.olt.ip||'')}<br>${esc(countsTxt(o.counts))}<br><a href="/fiber">buka fiber →</a>`);
    } else if(o.registered){missing.push('OLT '+o.name);}
  });
  document.getElementById('mapCount').textContent=marks?`${marks} titik`:''; 
  const nc=document.getElementById('noCoord');
  if(missing.length){nc.style.display='block';nc.innerHTML=`<b>${missing.length} lokasi belum ada koordinat:</b> ${missing.slice(0,12).map(esc).join(', ')}${missing.length>12?' …':''}<br>isi lat/lon via kelola ODP/OLT di halaman fiber.`;}
  else nc.style.display='none';
  if(bounds.length&&firstFit){map.fitBounds(bounds,{padding:[30,30]});firstFit=false;}
}
function copyPos(){
  if(!lastClick)return;
  const t=`${lastClick.lat.toFixed(6)}, ${lastClick.lng.toFixed(6)}`;
  const done=()=>{const b=document.getElementById('copyBtn');if(b){b.textContent='tersalin ✓';setTimeout(()=>b.textContent='copy',1500);}};
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(done).catch(()=>alert(t));
  else alert(t);
}
load();setInterval(load,120000);
</script>
</body>
</html>
