<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Availability report graph</title>
  <script>
  (function () {
    try {
      var t = localStorage.getItem("nms_theme");
      if (t !== "light" && t !== "dark") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (_) {}
  })();
  </script>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      --bg: #eef1f6;
      --panel: #ffffff;
      --text: #1d2329;
      --muted: #5b6b78;
      --border: #d1d8dc;
      --accent: #0275d8;
      --grid: #d7dee4;
      --ok: #2f9e44;
      --warn: #d9a400;
      --bad: #d9534f;
      --empty: #9aa8b4;
    }
    html[data-theme="dark"] {
      --bg: #0b0f14;
      --panel: #121820;
      --text: #e6edf3;
      --muted: #8b9bab;
      --border: #243040;
      --accent: #4aa8ff;
      --grid: #263342;
      --ok: #4caf50;
      --warn: #e0b53c;
      --bad: #e5484d;
      --empty: #4a5b6b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--text); background: var(--bg); }
    .title { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 19px; font-weight: 500; }
    .crumbs { padding: 12px 16px 8px; color: var(--muted); font-size: 12px; }
    .crumbs a { color: var(--accent); text-decoration: none; }
    .crumbs a:hover { text-decoration: underline; }
    .crumbs .sep { margin: 0 7px; opacity: .6; }
    .chart-panel { margin: 0 16px; padding: 10px; border: 1px solid var(--border); background: var(--panel); }
    .chart-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 0 2px 8px; color: var(--muted); font-size: 12px; }
    .chart-meta b { color: var(--text); font-weight: 500; }
    .chart { display: block; width: 100%; height: 380px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 2px 0; color: var(--muted); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
    .legend b { color: var(--text); font-weight: 500; }
    footer { padding: 18px 16px 20px; color: var(--muted); text-align: center; font-size: 12px; }
    footer a { color: var(--muted); }
    @media (max-width: 700px) { .chart { height: 320px; } .title { font-size: 16px; } }
  </style>
</head>
<body>
  <header class="title">Availability report graph</header>
  <nav class="crumbs"><a href="{{ url_for('reports_page', page='availability') }}">Availability report</a><span class="sep">/</span><span>{{ graph_host_name|e }}{% if graph_trigger %}<span class="sep">/</span>{{ graph_trigger|e }}{% endif %}<span class="sep">/</span>Availability</span></nav>
  <main class="chart-panel">
    <div class="chart-meta">
      <span id="chartRange">Period: —</span>
      <span id="chartBuckets"></span>
    </div>
    <canvas id="availabilityGraph" class="chart" role="img" aria-label="Availability history graph for {{ graph_host_name|e }}"></canvas>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>OK (%) <b id="legendOk">—</b></span>
      <span><i style="background:var(--warn)"></i>Warning 95–99%</span>
      <span><i style="background:var(--bad)"></i>Problems (%) <b id="legendBad">—</b></span>
      <span><i style="background:var(--empty)"></i>No data</span>
    </div>
  </main>
  <footer><a href="https://www.zabbix.com/">Zabbix 7.4.15</a>. © 2001–2026, <a href="https://www.zabbix.com/sia">Zabbix SIA</a></footer>
  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("availabilityGraph");
      if (!canvas) return;

      var buckets = {{ graph_buckets|tojson }};
      var hostLabel = {{ graph_host_name|tojson }};
      var triggerLabel = {{ (graph_trigger or "")|tojson }};
      var overall = {{ graph_availability|tojson }};
      var hasData = {{ graph_has_data|tojson }};
      var fromIso = {{ graph_from.isoformat()|tojson }};
      var toIso = {{ graph_to.isoformat()|tojson }};

      function palette() {
        var styles = getComputedStyle(document.documentElement);
        function value(name, fallback) {
          var found = (styles.getPropertyValue(name) || "").trim();
          return found || fallback;
        }
        return {
          panel: value("--panel", "#ffffff"),
          text: value("--text", "#1d2329"),
          muted: value("--muted", "#5b6b78"),
          border: value("--border", "#d1d8dc"),
          grid: value("--grid", "#d7dee4"),
          ok: value("--ok", "#2f9e44"),
          warn: value("--warn", "#d9a400"),
          bad: value("--bad", "#d9534f"),
          empty: value("--empty", "#9aa8b4")
        };
      }

      function barColor(colors, value) {
        if (value === null || value === undefined) return colors.empty;
        if (value >= 99) return colors.ok;
        if (value >= 95) return colors.warn;
        return colors.bad;
      }

      function formatPeriod() {
        function fmt(date) {
          return date.toLocaleString(undefined, {
            day: "2-digit", month: "short", year: "numeric",
            hour: "2-digit", minute: "2-digit"
          });
        }
        var from = new Date(fromIso);
        var to = new Date(toIso);
        var range = document.getElementById("chartRange");
        if (range && !isNaN(from) && !isNaN(to)) {
          range.textContent = "Period: " + fmt(from) + " – " + fmt(to);
        }
        var count = document.getElementById("chartBuckets");
        if (count) count.textContent = buckets.length + " interval" + (buckets.length === 1 ? "" : "s");
      }

      function updateLegend() {
        var ok = document.getElementById("legendOk");
        var bad = document.getElementById("legendBad");
        var value = Number(overall);
        if (!hasData || !isFinite(value)) {
          if (ok) ok.textContent = "no data";
          if (bad) bad.textContent = "no data";
          return;
        }
        if (ok) ok.textContent = value.toFixed(2) + "%";
        if (bad) bad.textContent = Math.max(0, 100 - value).toFixed(2) + "%";
      }

      function draw() {
        var colors = palette();
        var ctx = canvas.getContext("2d");
        var ratio = window.devicePixelRatio || 1;
        var width = canvas.clientWidth || canvas.parentElement.clientWidth || 720;
        var height = canvas.clientHeight || 380;
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = colors.panel;
        ctx.fillRect(0, 0, width, height);

        var left = 44;
        var right = 14;
        var top = 28;
        var bottom = 42;
        var plotW = Math.max(10, width - left - right);
        var plotH = Math.max(10, height - top - bottom);

        ctx.fillStyle = colors.text;
        ctx.font = "600 13px system-ui, Arial";
        ctx.textAlign = "left";
        ctx.fillText(hostLabel + (triggerLabel ? " / " + triggerLabel : ""), left, 18);

        ctx.font = "10px system-ui, Arial";
        for (var step = 0; step <= 5; step++) {
          var tickValue = step * 20;
          var y = top + plotH - (tickValue / 100) * plotH;
          ctx.strokeStyle = colors.grid;
          ctx.lineWidth = 1;
          ctx.setLineDash([2, 3]);
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(left + plotW, y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = colors.muted;
          ctx.textAlign = "right";
          ctx.fillText(tickValue + "%", left - 7, y + 3);
        }

        ctx.strokeStyle = colors.border;
        ctx.beginPath();
        ctx.moveTo(left, top);
        ctx.lineTo(left, top + plotH);
        ctx.lineTo(left + plotW, top + plotH);
        ctx.stroke();

        if (!buckets.length) {
          ctx.fillStyle = colors.muted;
          ctx.font = "13px system-ui, Arial";
          ctx.textAlign = "center";
          ctx.fillText("No availability data for the selected period", left + plotW / 2, top + plotH / 2);
          return;
        }

        var slot = plotW / buckets.length;
        var barW = Math.max(2, Math.min(24, slot * 0.62));
        for (var i = 0; i < buckets.length; i++) {
          var bucket = buckets[i] || {};
          var availability = bucket.availability;
          var x = left + i * slot + (slot - barW) / 2;
          if (availability === null || availability === undefined) {
            ctx.fillStyle = colors.empty;
            ctx.fillRect(x, top + plotH - 2, barW, 2);
            continue;
          }
          var barH = Math.max(2, (Number(availability) / 100) * plotH);
          ctx.fillStyle = barColor(colors, Number(availability));
          ctx.fillRect(x, top + plotH - barH, barW, barH);
        }

        var labelStep = Math.max(1, Math.ceil(buckets.length / Math.max(1, Math.floor(plotW / 78))));
        ctx.fillStyle = colors.muted;
        ctx.font = "10px system-ui, Arial";
        for (var j = 0; j < buckets.length; j += labelStep) {
          var centerX = left + j * slot + slot / 2;
          ctx.save();
          ctx.translate(centerX, top + plotH + 8);
          ctx.rotate(-Math.PI / 4);
          ctx.textAlign = "right";
          ctx.fillText(String(buckets[j].label || ""), 0, 0);
          ctx.restore();
        }

        if (!hasData) {
          ctx.fillStyle = colors.muted;
          ctx.font = "13px system-ui, Arial";
          ctx.textAlign = "center";
          ctx.fillText("No availability data for the selected period", left + plotW / 2, top + plotH / 2);
        }
      }

      formatPeriod();
      updateLegend();
      draw();
      window.addEventListener("resize", draw);
    })();
  </script>
</body>
</html>
