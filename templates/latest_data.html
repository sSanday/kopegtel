<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="NMS Kopegtel — Latest data: nilai terkini semua item pantauan per host (CPU, memori, storage, suhu, ping, bandwidth)">
<title>Latest data · NMS Kopegtel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<script>
// Terapkan tema tersimpan sebelum render untuk menghindari kedip.
(function () {
  try {
    var t = localStorage.getItem("nms_theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "dark" ? "#0b0f14" : "#eef1f6");
  } catch (_) {}
})();
</script>
<style>
/* ============ Halaman Latest data (struktur Zabbix, tema aplikasi) ============ */
.zbx { padding: 18px 22px 40px; max-width: 1400px; }

.zbx-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.zbx-head h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
.zbx-head .spacer { flex: 1; }
.zbx-help { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; color: var(--text-2); text-decoration: none; font-weight: 700; border: 1px solid var(--border); }
.zbx-help:hover { color: var(--text); background: var(--surface-2); }

/* ---- Bar filter ---- */
.zbx-bar { display: flex; align-items: center; gap: 10px; }
.zbx-fbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border); cursor: pointer;
}
.zbx-fbtn:hover { color: var(--text); }
.zbx-fbtn.on { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
.zbx-bar .grow { flex: 1; }
.zbx-total { color: var(--text-3); font-size: 12.5px; }

/* ---- Panel filter ---- */
.zbx-filter {
  margin-top: 8px; padding: 16px 18px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
}
.zbx-filter.hidden { display: none; }
.zbx-fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 48px; }
@media (max-width: 980px) { .zbx-fgrid { grid-template-columns: 1fr; } }
.zbx-frow { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 10px; min-height: 34px; }
.zbx-frow > label.f { text-align: right; font-size: 12px; color: var(--text-2); font-weight: 500; }
.zbx-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; max-width: 100%; justify-self: start; }
.zbx-seg button {
  border: none; background: var(--surface-2); color: var(--text-2);
  font-size: 12.5px; font-weight: 500; padding: 7px 13px; cursor: pointer;
  border-right: 1px solid var(--border); font-family: inherit;
}
.zbx-seg button:last-child { border-right: none; }
.zbx-seg button:hover { color: var(--text); }
.zbx-seg button.on { background: var(--accent-btn); color: var(--on-primary); font-weight: 600; }
.zbx-input {
  width: 100%; box-sizing: border-box;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 10px; font-size: 13px; font-family: inherit;
}
.zbx-input::placeholder { color: var(--text-3); }
.zbx-input:focus { outline: none; border-color: var(--accent); }
.zbx-cb { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.zbx-cb input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.zbx-cb:hover { color: var(--text); }
.zbx-factions { display: flex; justify-content: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.zbx-btn {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  border-radius: 8px; font-weight: 600; font-size: 13px; padding: 8px 18px; cursor: pointer; font-family: inherit;
}
.zbx-btn:hover { background: var(--accent-soft); }
.zbx-btn.primary { background: var(--accent-btn); color: var(--on-primary); border-color: transparent; }
.zbx-btn.primary:hover { filter: brightness(1.08); }

/* ---- Tabel hasil ---- */
.zbx-table-wrap {
  margin-top: 10px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
}
.zbx-scroll { overflow-x: auto; }
table.zbx { width: 100%; border-collapse: collapse; font-size: 13px; }
table.zbx thead th {
  text-align: left; font-weight: 600; color: var(--text-2);
  padding: 10px 10px; white-space: nowrap; border-bottom: 1px solid var(--border);
  background: var(--surface); font-size: 12.5px;
}
table.zbx thead th .th-sort {
  background: none; border: none; color: inherit; font: inherit; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; padding: 0; font-family: inherit;
}
table.zbx thead th .th-sort:hover { color: var(--text); }
.chev-mini { width: 11px; height: 11px; transition: transform .15s; }
.chev-mini.asc { transform: rotate(180deg); }
table.zbx tbody td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-2); }
table.zbx tbody tr:hover td { background: var(--surface-2); }
table.zbx tbody tr:last-child td { border-bottom: none; }
td.hostc { min-width: 170px; }
.host-name { color: var(--text); font-weight: 600; }
.host-link { color: var(--text); font-weight: 600; text-decoration: none; }
.host-link:hover { color: var(--accent); text-decoration: underline; }
.host-ip { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
td.namec { min-width: 150px; color: var(--text); }
.item-detail { margin-top: 3px; font-size: 11.5px; color: var(--text-3); font-weight: 400; }
td.checkc { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-3); font-size: 12.5px; }
td.valc { white-space: nowrap; font-variant-numeric: tabular-nums; }
.val { font-weight: 600; color: var(--text); }
.val-unit { color: var(--text-3); font-size: 11.5px; margin-left: 3px; }
.val.val-warn { color: #d9a13c; }
.val.val-bad { color: #e5484d; }
td.changec { white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.chg { color: var(--text-2); }
.chg.up { color: #d9a13c; }
.chg.down { color: #3fb27f; }
.tagchip {
  display: inline-block; background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-3); border-radius: 999px; padding: 2px 9px; font-size: 11px; white-space: nowrap;
}
td.infoc { white-space: nowrap; font-size: 12px; color: var(--text-3); }
.src-badge {
  display: inline-block; border-radius: 6px; padding: 2px 8px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .02em; line-height: 16px;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
}
.zbx-empty { padding: 42px 12px; text-align: center; color: var(--text-3); font-size: 13px; }
.zbx-empty svg { width: 34px; height: 34px; opacity: .5; margin-bottom: 8px; }
.zbx-empty .big { font-size: 14.5px; color: var(--text-2); font-weight: 600; margin-bottom: 4px; }
.zbx-foot { display: flex; align-items: center; gap: 18px; padding: 10px 12px; color: var(--text-3); font-size: 12px; }
.zbx-foot .grow { flex: 1; }

/* toast */
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 500; }
.toast {
  display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: 10px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: opacity .25s;
}
.toast svg { width: 16px; height: 16px; }
.toast.success svg { color: #3fb27f; }
.toast.error svg { color: #e5484d; }

@media (max-width: 720px) {
  .zbx { padding: 14px 12px 30px; }
  .zbx-frow { grid-template-columns: 1fr; }
  .zbx-frow > label.f { text-align: left; }
}
</style>
</head>

<script>
/* ================= Shell: tema, sidebar, menu ================= */
(function () {
  function $(id) { return document.getElementById(id); }
  var ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5z"/></svg>';
  var ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="width:19px;height:19px"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('nms_theme', t); } catch (_) {}
    var b = $('themeBtn');
    if (b) { b.innerHTML = t === 'dark' ? ICON_SUN : ICON_MOON; b.title = t === 'dark' ? 'Ganti ke mode terang' : 'Ganti ke mode gelap'; }
  }
  try {
    var t = localStorage.getItem('nms_theme');
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    setTheme(t);
  } catch (_) {}
  var tb = $('themeBtn'); if (tb) tb.addEventListener('click', function () { setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); });
  try { if (localStorage.getItem('nms_nav') === 'collapsed' && window.innerWidth > 1100) document.body.classList.add('nav-collapsed'); } catch (_) {}
  var st = $('sidebarToggle'); if (st) st.addEventListener('click', function () { document.body.classList.toggle('nav-open'); });
  var sc = $('scrim'); if (sc) sc.addEventListener('click', function () { document.body.classList.remove('nav-open'); });
  var cb = $('collapseBtn'); if (cb) cb.addEventListener('click', function () {
    document.body.classList.toggle('nav-collapsed');
    try { localStorage.setItem('nms_nav', document.body.classList.contains('nav-collapsed') ? 'collapsed' : 'open'); } catch (_) {}
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.body.classList.remove('nav-open'); });
  var ub = $('userBtn'), um = $('userMenu');
  if (ub && um) {
    ub.addEventListener('click', function (e) { e.stopPropagation(); var open = um.style.display === 'none'; um.style.display = open ? 'block' : 'none'; ub.setAttribute('aria-expanded', open ? 'true' : 'false'); });
    document.addEventListener('click', function () { um.style.display = 'none'; ub.setAttribute('aria-expanded', 'false'); });
    um.addEventListener('click', function (e) { e.stopPropagation(); });
  }
  window.toast = function (msg, type) {
    var w = $('toasts'); if (!w) return;
    var el = document.createElement('div');
    el.className = 'toast ' + (type === 'error' ? 'error' : 'success');
    el.setAttribute('role', 'status');
    el.innerHTML = (type === 'error'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 17H2L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>') + '<span></span>';
    el.lastChild.textContent = msg;
    w.appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 250); }, 3500);
  };
})();

/* ================= Latest data: filter, tabel ================= */
(function () {
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var REFRESH_S = 30;
  var state = { host: '', group: '', name: '', sort: 'name_asc', source: 'all', details: false };
  var applied = false;   /* false = "Filter is not set" ala Zabbix */
  var timerLeft = REFRESH_S;

  function buildQuery() {
    var q = new URLSearchParams();
    q.set('sort', state.sort);
    if (state.host.trim()) q.set('host', state.host.trim());
    if (state.group.trim()) q.set('group', state.group.trim());
    if (state.name.trim()) q.set('name', state.name.trim());
    if (state.source !== 'all') q.set('source', state.source);
    return q.toString();
  }

  function bindSeg(id, key) {
    var seg = $(id);
    seg.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      [].forEach.call(seg.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
      state[key] = b.getAttribute('data-' + key);
      applied = true;
      load();
    });
  }
  function syncSegButtons() {
    [].forEach.call($('segSort').querySelectorAll('button'), function (x) { x.classList.toggle('on', x.getAttribute('data-sort') === state.sort); });
    [].forEach.call($('segSource').querySelectorAll('button'), function (x) { x.classList.toggle('on', x.getAttribute('data-source') === state.source); });
  }
  bindSeg('segSort', 'sort');
  bindSeg('segSource', 'source');

  $('filterToggle').addEventListener('click', function () {
    var p = $('filterPanel');
    var hide = p.classList.toggle('hidden');
    this.classList.toggle('on', !hide);
    this.setAttribute('aria-expanded', hide ? 'false' : 'true');
  });

  $('sortName').addEventListener('click', function () {
    state.sort = (state.sort === 'name_asc' || state.sort === 'name_desc')
      ? (state.sort === 'name_asc' ? 'name_desc' : 'name_asc')
      : 'name_asc';
    syncSegButtons();
    applied = true;
    load();
  });

  $('btnApply').addEventListener('click', function () {
    state.host = $('fHost').value;
    state.group = $('fGroup').value;
    state.name = $('fName').value;
    state.details = $('optDetails').checked;
    applied = true;
    load();
  });

  $('btnReset').addEventListener('click', function () {
    state = { host: '', group: '', name: '', sort: 'name_asc', source: 'all', details: false };
    $('fHost').value = ''; $('fGroup').value = ''; $('fName').value = ''; $('optDetails').checked = false;
    syncSegButtons();
    applied = true;
    load();
  });

  $('btnSave').addEventListener('click', function () {
    $('btnApply').click();
    try { localStorage.setItem('nms_latest_filter', JSON.stringify(state)); toast('Filter disimpan'); }
    catch (_) { toast('Gagal menyimpan filter', 'error'); }
  });
  (function restoreSaved() {
    try {
      var saved = JSON.parse(localStorage.getItem('nms_latest_filter') || 'null');
      if (!saved) return;
      state = Object.assign(state, saved);
      $('fHost').value = state.host || ''; $('fGroup').value = state.group || ''; $('fName').value = state.name || '';
      $('optDetails').checked = !!state.details;
      syncSegButtons();
      applied = true; /* filter tersimpan → langsung muat data */
    } catch (_) {}
  })();

  // Deep link dari halaman Hosts: /latest-data?host=<ip>
  (function applyUrlHost() {
    try {
      var h = new URLSearchParams(location.search).get('host');
      if (h) { state.host = h; $('fHost').value = h; applied = true; }
    } catch (_) {}
  })();

  function valueClass(item) {
    var v = item.value;
    if (item.unit === '%') return v >= 90 ? 'val-bad' : (v >= 80 ? 'val-warn' : '');
    if (item.unit === '°C') return v >= 70 ? 'val-bad' : (v >= 60 ? 'val-warn' : '');
    return '';
  }
  function fmt(n) { return (Number(n)).toFixed(1); }
  function changeHtml(d) {
    if (d.delta === null || d.delta === undefined) return '<span class="chg">–</span>';
    if (d.delta === 0) return '<span class="chg">0</span>';
    var cls = d.delta > 0 ? 'up' : 'down';
    var arrow = d.delta > 0 ? '▲' : '▼';
    return '<span class="chg ' + cls + '">' + arrow + ' ' + (d.delta > 0 ? '+' : '−') + fmt(Math.abs(d.delta)) + '</span>';
  }
  function rowHtml(d) {
    var detail = state.details
          ? '<div class="item-detail">' +
        (d.prev === null || d.prev === undefined
          ? 'belum ada nilai sebelumnya'
          : 'sebelumnya ' + fmt(d.prev) + ' ' + esc(d.unit) + ' · ' + esc(d.prev_check || '')) + '</div>'
      : '';
    return '<tr>' +
      '<td class="hostc"><a class="host-link" href="/hosts?name=' + encodeURIComponent(d.ip) + '">' + esc(d.host) + '</a><br><span class="host-ip">' + esc(d.ip) + '</span></td>' +
      '<td class="namec">' + esc(d.name) + detail + '</td>' +
      '<td class="checkc">' + esc(d.check) + '</td>' +
      '<td class="valc"><span class="val ' + valueClass(d) + '">' + fmt(d.value) + '</span><span class="val-unit">' + esc(d.unit) + '</span></td>' +
      '<td class="changec">' + changeHtml(d) + '</td>' +
      '<td><span class="tagchip">' + esc(d.category || 'Uncategorized') + '</span></td>' +
      '<td class="infoc"><span class="src-badge">' + d.source.toUpperCase() + '</span></td>' +
      '</tr>';
  }
  function emptyNotSet() {
    $('tbody').innerHTML = '<tr><td colspan="7" class="zbx-empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/></svg>' +
      '<div class="big">Filter belum diatur</div>' +
      '<div>Gunakan panel filter untuk menampilkan hasil</div></td></tr>';
    $('footCount').textContent = '';
    $('totalLabel').textContent = '';
    $('footUpdated').textContent = '';
  }
  function render(data) {
    var rows = data.items || [];
    var tb = $('tbody');
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="7" class="zbx-empty">Tidak ada item sesuai filter.</td></tr>';
    } else {
      var html = '';
      for (var i = 0; i < rows.length; i++) html += rowHtml(rows[i]);
      tb.innerHTML = html;
    }
    $('footCount').textContent = 'Menampilkan ' + rows.length + ' dari ' + data.total + ' item';
    $('totalLabel').textContent = rows.length + ' dari ' + data.total + ' item';
    $('footUpdated').textContent = 'Diperbarui ' + new Date().toLocaleTimeString('id-ID');
    var cats = data.categories || [];
    $('groupOptions').innerHTML = cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
    $('hostOptions').innerHTML = (data.hosts || []).map(function (h) { return '<option value="' + esc(h) + '">'; }).join('');
  }
  function load() {
    return fetch('/api/latest-data?' + buildQuery(), { credentials: 'same-origin', headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(render)
      .catch(function (err) {
        $('footCount').textContent = 'Gagal memuat data: ' + err.message;
      });
  }

  setInterval(function () {
    if (!applied) return;
    timerLeft -= 1;
    if (timerLeft <= 0) { timerLeft = REFRESH_S; load(); }
    $('refreshLabel').textContent = 'Muat ulang otomatis dalam ' + timerLeft + ' detik';
  }, 1000);

  // Perilaku Zabbix: tanpa filter ter-apply, tabel menampilkan
  // "Filter is not set". Setelah terapkan / ada filter tersimpan, data dimuat.
  if (applied) load(); else emptyNotSet();
})();
</script>
</body>
</html>
