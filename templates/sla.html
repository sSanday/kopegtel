<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLA Dashboard</title><style>body{font-family:Arial;background:#08101c;color:#e6f1ff;margin:0}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#101c2d;border:1px solid #263b55;border-radius:8px;padding:16px;margin-bottom:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #263b55}.good{color:#5ee89b}.bad{color:#ff7777}.muted{color:#8ca4bd}button{background:#0a1422;color:#65d9ff;border:1px solid #38516d;padding:8px;border-radius:5px}</style></head><body><main class="wrap"><p><a href="/">← Dashboard</a></p><h1>SLA Dashboard per Site</h1><div class="card"><button onclick="load(7)">7 hari</button> <button onclick="load(30)">30 hari</button><span id="status" class="muted"></span></div><div class="card"><h2>Historis Uptime</h2><div id="chart" style="display:flex;align-items:end;gap:4px;height:140px"></div></div><div class="card"><h2>Traffic Interface</h2><input id="ifaceHost" placeholder="IP host"><button onclick="loadTraffic()">Load</button><div id="traffic" class="muted"></div></div><div class="card"><table><thead><tr><th>Site</th><th>Host</th><th>Checks</th><th>Uptime</th><th>Outage</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>async function load(days){const r=await fetch(`/api/sla/sites?days=${days}`,{headers:{'X-Requested-With':'XMLHttpRequest'}});const d=await r.json();const h=await (await fetch(`/api/sla/history?days=${days}`,{headers:{'X-Requested-With':'XMLHttpRequest'}})).json();document.getElementById('chart').innerHTML=(h.history||[]).map(x=>`<div title="${x.date}: ${x.uptime_pct??'—'}%" style="flex:1;background:#35d88a;height:${Math.max(4,Math.min(100,x.uptime_pct||0))}%;min-width:4px"></div>`).join('');document.getElementById('status').textContent=`Periode ${d.days} hari`;document.getElementById('rows').innerHTML=(d.sites||[]).map(x=>`<tr><td>${x.site}</td><td>${x.hosts}</td><td>${x.checks}</td><td class="${x.uptime_pct!=null&&x.uptime_pct<99?'bad':'good'}">${x.uptime_pct==null?'—':x.uptime_pct+'%'}</td><td>${x.outages}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada data lokasi inventory.</td></tr>'}load(7);async function loadTraffic(){const host=document.getElementById('ifaceHost').value.trim();if(!host)return;const d=await (await fetch(`/api/interfaces/traffic?host=${encodeURIComponent(host)}&hours=24`,{headers:{'X-Requested-With':'XMLHttpRequest'}})).json();document.getElementById('traffic').innerHTML=(d.traffic||[]).map(x=>`${x.timestamp} · if${x.if_index} · in ${x.net_in} Mbps · out ${x.net_out} Mbps`).join('<br>')||'Belum ada data traffic'}</script></body></html>
