apiVersion: v1
kind: Namespace
metadata:
  name: nms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nms-config
  namespace: nms
data:
  TZ: Asia/Jakarta
  NMS_DB_PATH: /var/lib/nms/network.db
  NMS_DISABLE_SCHEDULER: "0"
  NMS_ROLE: web
---
apiVersion: v1
kind: Secret
metadata:
  name: nms-secrets
  namespace: nms
type: Opaque
stringData:
  DASHBOARD_USERNAME: change-me
  DASHBOARD_PASSWORD: change-me
  SECRET_KEY: change-me
  AGENT_API_KEY: change-me
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nms-data
  namespace: nms
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms-dashboard
  namespace: nms
  labels:
    app.kubernetes.io/name: nms-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nms-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nms-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nms-dashboard
          image: ghcr.io/your-org/nms-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: nms-config
            - secretRef:
                name: nms-secrets
          volumeMounts:
            - name: nms-data
              mountPath: /var/lib/nms
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nms-data
          persistentVolumeClaim:
            claimName: nms-data
---
apiVersion: v1
kind: Service
metadata:
  name: nms-dashboard
  namespace: nms
spec:
  selector:
    app.kubernetes.io/name: nms-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nms-dashboard
  namespace: nms
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nms-dashboard
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nms-dashboard
  namespace: nms
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nms-dashboard
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 5000
  egress:
    - {}
