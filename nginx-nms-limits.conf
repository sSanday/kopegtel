# Snippet rate-limit NMS KOPEGTEL — OPSIONAL, hanya jika zona belum ada.
#
# CEK DULU: grep -n "limit_req_zone" /etc/nginx/nginx.conf
# - Jika nms_login & nms_api SUDAH ada di sana -> file ini TIDAK dipakai
#   (memasang dobel = error "already bound", nginx gagal reload).
# - Jika BELUM ada -> taruh file ini di konteks http{}:
#   sudo cp nginx-nms-limits.conf /etc/nginx/conf.d/nms-limits.conf
#
# Cara pasang server block (sekali saja):
#   sudo cp nginx-nms.conf /etc/nginx/sites-available/nms
#   sudo ln -s /etc/nginx/sites-available/nms /etc/nginx/sites-enabled/nms
#   sudo nginx -t && sudo systemctl reload nginx
#
# PENTING: limit_req_zone TIDAK boleh di dalam server{} — nginx gagal reload
# ("zero size shared memory zone") jika zona belum terdefinisi di http{}.

limit_req_zone $binary_remote_addr zone=nms_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=nms_api:10m rate=60r/m;
